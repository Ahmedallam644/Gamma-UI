kind = "web"
previewPath = "/"
title = "Nursing Academic Projects Generator"
version = "1.0.0"
id = "artifacts/nursing-projects"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21677

[services.development]
run = "pnpm --filter @workspace/nursing-projects run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nursing-projects", "run", "build" ]
publicDir = "artifacts/nursing-projects/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21677"
BASE_PATH = "/"
